name: Isolated Android Node candidate
on:
  push:
    paths:
      - 'dsh-go/tooling/android-node-probe/**'
      - 'dsh-go/tooling/model-sdk-probe/package*.json'
      - '!dsh-go/tooling/android-node-probe/README.md'
      - 'dsh-go/runtime/minimax-bot-host/model-broker.mjs'
      - 'dsh-go/runtime/minimax-bot-host/model-fd-client.mjs'
      - 'dsh-go/runtime/minimax-bot-host/model-sdk-fetch.mjs'
      - 'dsh-go/runtime/minimax-bot-host/native-model-route.mjs'
      - 'dsh-go/runtime/minimax-bot-host/native-model-binding.mjs'
      - 'dsh-go/runtime/minimax-bot-host/model-fetch-scope.mjs'
      - 'dsh-go/runtime/minimax-bot-host/runtime-descriptor.mjs'
      - 'dsh-go/runtime/minimax-bot-host/runtime-catalog-policy.mjs'
      - 'dsh-go/runtime/minimax-bot-host/bot-fd-transport.mjs'
      - 'dsh-go/runtime/minimax-bot-host/bot-fd-ingress.mjs'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/runtime/RuntimeDescriptor*.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/model/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeDatabaseFiles.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimePrivateDirectory.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeDirectoryMutationLock.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeAtomicPublisher.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/NativeRuntimePublication.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/BoundedPipe*.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeFileSnapshot.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeFileCommit*.kt'
      - 'dsh-go/app/android/app/src/main/cpp/**'
      - 'dsh-go/app/android/app/build.gradle.kts'
      - 'dsh-go/app/android/app/proguard-rules.pro'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/ModelRequestClient.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/GrantedConnectionQueue.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/bot/**'
      - 'dsh-go/app/android/app/src/main/res/xml/network_security_config.xml'
      - 'dsh-go/tooling/android-broker-probe/report-denials.py'
      - '.github/workflows/android-node-probe.yml'
  pull_request:
    paths:
      - 'dsh-go/tooling/android-node-probe/**'
      - 'dsh-go/tooling/model-sdk-probe/package*.json'
      - '!dsh-go/tooling/android-node-probe/README.md'
      - 'dsh-go/runtime/minimax-bot-host/model-broker.mjs'
      - 'dsh-go/runtime/minimax-bot-host/model-fd-client.mjs'
      - 'dsh-go/runtime/minimax-bot-host/model-sdk-fetch.mjs'
      - 'dsh-go/runtime/minimax-bot-host/native-model-route.mjs'
      - 'dsh-go/runtime/minimax-bot-host/native-model-binding.mjs'
      - 'dsh-go/runtime/minimax-bot-host/model-fetch-scope.mjs'
      - 'dsh-go/runtime/minimax-bot-host/runtime-descriptor.mjs'
      - 'dsh-go/runtime/minimax-bot-host/runtime-catalog-policy.mjs'
      - 'dsh-go/runtime/minimax-bot-host/bot-fd-transport.mjs'
      - 'dsh-go/runtime/minimax-bot-host/bot-fd-ingress.mjs'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/runtime/RuntimeDescriptor*.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/model/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeDatabaseFiles.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimePrivateDirectory.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeDirectoryMutationLock.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeAtomicPublisher.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/NativeRuntimePublication.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/BoundedPipe*.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeFileSnapshot.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/RuntimeFileCommit*.kt'
      - 'dsh-go/app/android/app/src/main/cpp/**'
      - 'dsh-go/app/android/app/build.gradle.kts'
      - 'dsh-go/app/android/app/proguard-rules.pro'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/ModelRequestClient.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/GrantedConnectionQueue.kt'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/bot/**'
      - 'dsh-go/app/android/app/src/main/res/xml/network_security_config.xml'
      - 'dsh-go/tooling/android-broker-probe/report-denials.py'
      - '.github/workflows/android-node-probe.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional successful full-ICU producer run on this branch; empty uses the pinned release'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  isolated-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pin a successful source producer here after it exists, then push this
      # workflow. This also works when workflow_dispatch is not registered on main.
      # 41826964330 is the full-ICU producer whose build, verify (26) and verify
      # (35) all succeeded; its artifact is still unexpired and the five build
      # inputs are unchanged, so the combination matrix may reuse it.
      PINNED_SOURCE_RUN_ID: '41826964330'
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Select and authorize the verification Node input
        id: source_input
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '' }}
        run: |
          source_run_id="${REQUESTED_SOURCE_RUN_ID:-$PINNED_SOURCE_RUN_ID}"
          if [ -n "$source_run_id" ]; then
            python3 dsh-go/tooling/android-node-probe/verify-source-run.py "$source_run_id"
          fi
          printf 'run_id=%s\n' "$source_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.source_input.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source_input.outputs.run_id }}
          name: node-full-icu-verification-input
          path: ${{ runner.temp }}/authorized-node-source
      - name: Prepare pinned Node candidate and verification JNI
        env:
          SOURCE_RUN_ID: ${{ steps.source_input.outputs.run_id }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
          if [ -n "$SOURCE_RUN_ID" ]; then
            source_archive="$RUNNER_TEMP/authorized-node-source/node-full-icu.zip"
            source_archive_sha="$(sha256sum "$source_archive" | cut -d ' ' -f 1)"
            python3 dsh-go/tooling/android-node-probe/prepare-probe.py \
              --ndk "$ANDROID_HOME/ndk/27.3.13750724" \
              --archive "$source_archive" --source-build-sha "$source_archive_sha"
          else
            python3 dsh-go/tooling/android-node-probe/prepare-probe.py --ndk "$ANDROID_HOME/ndk/27.3.13750724"
          fi
      - name: Compile the production file kernel for both mobile ABIs
        run: |
          python3 dsh-go/tooling/android-node-probe/check-native-files.py \
            --ndk "$ANDROID_HOME/ndk/27.3.13750724" \
            --cmake "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - name: Build pinned SQLite addon and explicit data FD VFS
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix dsh-go/tooling/model-sdk-probe
          python3 dsh-go/tooling/android-node-probe/prepare-sqlite.py \
            --ndk "$ANDROID_HOME/ndk/27.3.13750724" \
            --esbuild dsh-go/tooling/model-sdk-probe/node_modules/.bin/esbuild
      - name: Check the exact packaged JS on the host (not isolation evidence)
        run: |
          node --test dsh-go/tooling/android-node-probe/probe-bundle.test.mjs
          python3 -m unittest discover -s dsh-go/tooling/android-node-probe -p 'test_*.py' -v
          python3 dsh-go/tooling/android-node-probe/test-fd-vfs.py \
            --archive dsh-go/tooling/android-node-probe/build/downloads/better-sqlite3.tgz \
            --node-probe \
            --ndk "$ANDROID_HOME/ndk/27.3.13750724"
      - name: Require KVM on the ephemeral test runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run isolated Node against native fake-provider model streams
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2
          script: bash dsh-go/tooling/android-node-probe/run-device-tests.sh
      - name: Record counts only, never Node reports or environment snapshots
        id: results
        if: always()
        run: |
          python3 dsh-go/tooling/android-node-probe/report-results.py \
            dsh-go/tooling/android-node-probe/build/outputs/androidTest-results/connected
      - name: Save test XML and finite result status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-candidate-results-api-${{ matrix.api-level }}-${{ steps.results.outputs.result_id }}
          path: |
            dsh-go/tooling/android-node-probe/build/outputs/androidTest-results/connected/**/*.xml
            dsh-go/tooling/android-node-probe/build/outputs/androidTest-results/node-probe-status.txt
          if-no-files-found: ignore
          retention-days: 7
