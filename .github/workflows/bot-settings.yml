name: Bot settings integration
on:
  push:
    paths: ['packages/mbot_settings/**', 'dsh-go/app/lib/bot/**', 'dsh-go/app/lib/ui/settings/settings_screen.dart', 'dsh-go/app/test/bots/**', 'dsh-go/app/pubspec.*', '.github/workflows/bot-settings.yml']
  pull_request:
    paths: ['packages/mbot_settings/**', 'dsh-go/app/lib/bot/**', 'dsh-go/app/lib/ui/settings/settings_screen.dart', 'dsh-go/app/test/bots/**', 'dsh-go/app/pubspec.*', '.github/workflows/bot-settings.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Settings package tests and analysis
        working-directory: packages/mbot_settings
        run: |
          flutter pub get
          flutter test
          dart analyze
      - name: Install widget test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - name: Test settings integration with the app shell
        working-directory: dsh-go/app
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
        run: |
          flutter pub get
          flutter analyze --no-pub lib/bot lib/ui/settings/settings_screen.dart test/bots/bot_settings_hub_test.dart
          flutter test --no-pub test/bots/minimax_bot_home_test.dart test/bots/bot_settings_hub_test.dart test/bots/bot_usage_test.dart
