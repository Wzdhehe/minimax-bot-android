# SPDX-License-Identifier: AGPL-3.0-only
name: Android broker emulator verification
on:
  push:
    paths:
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/model/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/bot/**'
      - 'dsh-go/app/android/app/src/main/res/xml/network_security_config.xml'
      - 'dsh-go/app/android/app/src/androidTest/**'
      - 'dsh-go/tooling/android-broker-probe/**'
      - '.github/workflows/android-broker-device.yml'
  pull_request:
    paths:
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/model/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/bot/**'
      - 'dsh-go/app/android/app/src/main/res/xml/network_security_config.xml'
      - 'dsh-go/app/android/app/src/androidTest/**'
      - 'dsh-go/tooling/android-broker-probe/**'
      - '.github/workflows/android-broker-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Require KVM on the ephemeral test runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install compilation packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Execute production broker and FD tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2
          script: bash dsh-go/tooling/android-broker-probe/run-device-tests.sh
      - name: Record device test counts and names without response bodies
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('dsh-go/tooling/android-broker-probe/build/outputs/androidTest-results/connected')
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for path in sorted(root.rglob('*.xml')):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
              for case in suite.findall('testcase'):
                  print(case.get('classname') + '.' + case.get('name'))
          print(totals)
          assert totals['tests'] >= 10, 'Expected production boundary and IPC/FD lifecycle tests'
          assert totals['failures'] == totals['errors'] == totals['skipped'] == 0
          PY
      - name: Save device test XML only (never APKs or signing files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-broker-device-results-api-${{ matrix.api-level }}
          path: dsh-go/tooling/android-broker-probe/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
