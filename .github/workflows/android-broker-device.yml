# SPDX-License-Identifier: AGPL-3.0-only
name: Android broker emulator verification
on:
  push:
    paths:
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/model/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/bot/**'
      - 'dsh-go/app/android/app/src/main/res/xml/network_security_config.xml'
      - 'dsh-go/app/android/app/src/androidTest/**'
      - 'dsh-go/tooling/android-broker-probe/**'
      - '.github/workflows/android-broker-device.yml'
  pull_request:
    paths:
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/model/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/isolation/**'
      - 'dsh-go/app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/bot/**'
      - 'dsh-go/app/android/app/src/main/res/xml/network_security_config.xml'
      - 'dsh-go/app/android/app/src/androidTest/**'
      - 'dsh-go/tooling/android-broker-probe/**'
      - '.github/workflows/android-broker-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Require KVM on the ephemeral test runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install compilation packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Execute production broker tests on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2
          script: gradle --no-daemon -p dsh-go/tooling/android-broker-probe connectedDebugAndroidTest
      - name: Save device test XML only (never APKs or signing files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-broker-device-results
          path: dsh-go/tooling/android-broker-probe/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
