name: Bot host and protocol checks

on:
  push:
    paths:
      - 'dsh-go/packages/dsh_client/**'
      - 'dsh-go/runtime/minimax-bot-host/**'
      - 'dsh-go/runtime/vendor/minimax-bot/**'
      - 'dsh-go/tooling/runtime-host-probe/**'
      - 'packages/mbot-workspace-guard/**'
      - 'docs/UPSTREAM-RUNTIME.md'
      - '.github/workflows/bot-host.yml'
  pull_request:
    paths:
      - 'dsh-go/packages/dsh_client/**'
      - 'dsh-go/runtime/minimax-bot-host/**'
      - 'dsh-go/runtime/vendor/minimax-bot/**'
      - 'dsh-go/tooling/runtime-host-probe/**'
      - 'packages/mbot-workspace-guard/**'
      - 'docs/UPSTREAM-RUNTIME.md'
      - '.github/workflows/bot-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Test Bot runtime adapter
        working-directory: dsh-go
        run: node --test runtime/minimax-bot-host/agent-port.test.mjs runtime/minimax-bot-host/service.test.mjs runtime/minimax-bot-host/bot-fd-transport.test.mjs runtime/minimax-bot-host/bot-fd-ingress.test.mjs runtime/minimax-bot-host/bot-store-persistence.test.mjs runtime/minimax-bot-host/runtime-descriptor.test.mjs runtime/minimax-bot-host/workspace.test.mjs runtime/minimax-bot-host/provider-broker.test.mjs runtime/minimax-bot-host/usage-quota.test.mjs runtime/minimax-bot-host/schedule.test.mjs runtime/minimax-bot-host/model-catalog-projection.test.mjs runtime/minimax-bot-host/native-model-binding.test.mjs runtime/minimax-bot-host/native-model-runtime.test.mjs
      - name: Test upstream Bot storage and usage regressions
        working-directory: dsh-go
        run: node --test runtime/vendor/minimax-bot/tests/storage-reliability.test.mjs runtime/vendor/minimax-bot/tests/usage-honest.test.mjs
      - name: Test workspace boundary
        working-directory: packages/mbot-workspace-guard
        run: npm test
      - name: Resolve client test dependencies
        working-directory: dsh-go/packages/dsh_client
        run: dart pub get
      - name: Analyze Bot and plugin clients
        working-directory: dsh-go/packages/dsh_client
        run: dart analyze lib/src/minimax_bot_api.dart lib/src/mcode_plugins_api.dart test/minimax_bot_api_test.dart test/mcode_plugins_api_test.dart test/mcode_plugins_runtime_test.dart
      - name: Test Bot HTTP and plugin wire contracts
        working-directory: dsh-go/packages/dsh_client
        run: dart test test/minimax_bot_api_test.dart test/mcode_plugins_api_test.dart

  upstream-runtime-pin:
    name: Pin and smoke the upstream runtime fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the upstream runtime pin
        working-directory: dsh-go
        run: node --test runtime/minimax-bot-host/upstream-runtime-pin.test.mjs
      - name: Read upstream runtime pin
        id: pin
        working-directory: dsh-go/runtime/minimax-bot-host
        run: |
          node --input-type=module -e '
            const { pathToFileURL } = await import("node:url");
            const mod = await import(pathToFileURL(process.argv[1]).href);
            console.log("repository=" + mod.UPSTREAM_RUNTIME_REPOSITORY);
            console.log("commit=" + mod.UPSTREAM_RUNTIME_COMMIT);
          ' ./upstream-runtime-pin.mjs >> "$GITHUB_OUTPUT"
      - name: Check out the pinned upstream runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream-runtime
      - name: Verify the pin, the document and the checkout agree
        working-directory: dsh-go/runtime/minimax-bot-host
        run: node upstream-runtime-pin-check.mjs --source "$GITHUB_WORKSPACE/upstream-runtime"
      - name: Install the upstream build tool
        working-directory: upstream-runtime
        run: |
          esbuild_version="$(node -p "require('./package.json').devDependencies.esbuild")"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/esbuild" "esbuild@$esbuild_version"
          echo "ESBUILD_BIN=$RUNNER_TEMP/esbuild/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
          echo "ESBUILD_MODULE=$RUNNER_TEMP/esbuild/node_modules/esbuild/lib/main.js" >> "$GITHUB_ENV"
      - name: Smoke the Bot host against the pinned upstream runtime
        working-directory: dsh-go
        env:
          WEBUI_SOURCE: ${{ github.workspace }}/upstream-runtime
        run: bash runtime/minimax-bot-host/run-upstream-gateway-smoke.sh
      - name: Verify the full pinned host build graph without executing it
        working-directory: dsh-go
        env:
          WEBUI_SOURCE: ${{ github.workspace }}/upstream-runtime
        run: node --test runtime/minimax-bot-host/runtime-bundle.test.mjs
      - name: Verify trusted Bot caller lifecycle against the pinned gateway
        working-directory: dsh-go
        env:
          WEBUI_SOURCE: ${{ github.workspace }}/upstream-runtime
        run: node --test runtime/minimax-bot-host/runtime-host-session.test.mjs
      - name: Install locked real-host probe dependencies without lifecycle scripts
        working-directory: dsh-go/tooling/runtime-host-probe
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the real-host probe bundle and verify canonical resources
        env:
          WEBUI_SOURCE: ${{ github.workspace }}/upstream-runtime
        run: |
          node dsh-go/runtime/minimax-bot-host/build-runtime-bundle.mjs \
            --source "$WEBUI_SOURCE" --esbuild-module "$ESBUILD_MODULE" \
            --out-dir "$RUNNER_TEMP/mbot-real-host"
      - name: Download and prepare the verified Linux-only SQLite host addon
        run: |
          curl -fL --retry 2 --max-time 120 \
            https://github.com/WiseLibs/better-sqlite3/releases/download/v12.11.1/better-sqlite3-v12.11.1-node-v137-linux-x64.tar.gz \
            -o "$RUNNER_TEMP/mbot-sqlite-host-node137.tar.gz"
          node dsh-go/tooling/runtime-host-probe/prepare.mjs \
            "$GITHUB_WORKSPACE/upstream-runtime" "$RUNNER_TEMP/mbot-real-host" \
            "$RUNNER_TEMP/mbot-sqlite-host-node137.tar.gz"
      - name: Boot and reopen the actual runtime and Bot JSON service (no model turn)
        working-directory: dsh-go/tooling/runtime-host-probe
        run: npm test
